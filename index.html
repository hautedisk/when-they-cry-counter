<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>スロットカウンター</title>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --text-main: #ffffff;
      --text-sub: #aaaaaa;
      --accent-green: #28a745;
      --accent-red: #dc3545;
      --accent-yellow: #ffc107;
      --accent-blue: #007bff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      padding: 10px;
    }

    .app-container {
      width: 100%;
      max-width: 420px;
    }

    /* 上部モード切替 */
    .mode-btn {
      width: 100%;
      padding: 12px;
      font-size: 1rem;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      background-color: var(--card-bg);
      color: var(--accent-green);
      cursor: pointer;
      margin-bottom: 10px;
    }

    .mode-btn.minus-mode {
      background-color: var(--accent-red);
      color: #ffffff;
    }

    /* ゲーム数パネル */
    .game-panel {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 10px;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .sub-btn {
      background: #2a2a2a;
      color: var(--text-main);
      border: none;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .sub-btn.highlight {
      color: var(--accent-yellow);
    }

    .game-display {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 12px;
    }

    .my-game {
      font-size: 2.2rem;
      font-weight: bold;
      color: var(--accent-green);
    }

    .game-sub-info {
      text-align: right;
      font-size: 0.85rem;
      color: var(--text-sub);
    }

    .game-sub-info strong {
      color: var(--text-main);
      font-size: 1rem;
    }

    .add-game-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }

    .add-g-btn {
      padding: 10px 0;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      color: #000000; /* ★黒文字で見やすく */
      cursor: pointer;
    }

    /* 子役カウンター一覧 */
    .counter-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .role-card {
      background-color: var(--card-bg);
      border-radius: 10px;
      padding: 10px 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .role-info .role-name {
      font-weight: bold;
      font-size: 1.1rem;
      margin-bottom: 2px;
    }

    .role-info .role-stat {
      font-size: 0.9rem;
      color: var(--text-sub);
    }

    /* カウントボタン */
    .count-btn {
      width: 70px;
      height: 48px;
      border: none;
      border-radius: 8px;
      font-size: 1.5rem;
      font-weight: bold;
      color: #000000; /* ★黒文字で見やすく */
      cursor: pointer;
    }

    /* リセットボタン */
    .reset-btn {
      width: 100%;
      background: transparent;
      color: var(--text-sub);
      border: 1px solid #333;
      padding: 8px;
      border-radius: 6px;
      margin-top: 15px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="app-container">
  <!-- 減算モード切替ボタン -->
  <button id="modeBtn" class="mode-btn" onclick="toggleMinusMode()">＋ 加算モード</button>

  <!-- ゲーム数表示エリア -->
  <div class="game-panel">
    <div class="panel-header">
      <button id="baseBtn" class="sub-btn highlight" onclick="toggleBase()">基準: 個人G</button>
      <div>
        <button class="sub-btn" onclick="setStartGames()">打ち始めG</button>
        <button class="sub-btn" onclick="setTotalGames()">総G入力</button>
      </div>
    </div>

    <div class="game-display">
      <div>
        <div style="font-size: 0.75rem; color: var(--text-sub);">MY PLAY</div>
        <div id="myGamesDisplay" class="my-game">0 G</div>
      </div>
      <div class="game-sub-info">
        <div>START: <span id="startGamesDisplay">0</span> G</div>
        <div>TOTAL: <strong id="totalGamesDisplay">0</strong> G</div>
      </div>
    </div>

    <div class="add-game-grid">
      <button class="add-g-btn" style="background:#28a745;" onclick="addGames(1)">+1G</button>
      <button class="add-g-btn" style="background:#007bff;" onclick="addGames(10)">+10G</button>
      <button class="add-g-btn" style="background:#ffc107;" onclick="addGames(50)">+50G</button>
      <button class="add-g-btn" style="background:#6f42c1;" onclick="addGames(100)">+100G</button>
    </div>
  </div>

  <!-- 子役一覧 -->
  <div id="roleList" class="counter-list"></div>

  <button class="reset-btn" onclick="resetAll()">データをリセット</button>
</div>

<script>
  // データ状態
  let startGames = 0;
  let myGames = 0;
  let useMyGamesForProb = true;
  let isMinusMode = false;

  const roles = [
    { id: "bell", name: "ベル", color: "#61dafb", count: 0 },
    { id: "weak_cherry", name: "弱チェリー", color: "#ff6b6b", count: 0 },
    { id: "strong_cherry", name: "強チェリー", color: "#ff4757", count: 0 },
    { id: "weak_watermelon", name: "弱スイカ", color: "#2ed573", count: 0 },
    { id: "strong_watermelon", name: "強スイカ", color: "#1e90ff", count: 0 },
    { id: "chance_a", name: "チャンス目A", color: "#ffa502", count: 0 },
    { id: "chance_b", name: "チャンス目B", color: "#ff7f50", count: 0 },
    { id: "special", name: "確定役", color: "#e056fd", count: 0 }
  ];

  // 初期化 render
  function render() {
    // ゲーム数表示の更新
    const totalGames = startGames + myGames;
    document.getElementById("myGamesDisplay").innerText = `${myGames} G`;
    document.getElementById("startGamesDisplay").innerText = startGames;
    document.getElementById("totalGamesDisplay").innerText = totalGames;

    // 計算の分母
    const baseG = useMyGamesForProb ? myGames : totalGames;

    // 子役リスト更新
    const listContainer = document.getElementById("roleList");
    listContainer.innerHTML = "";

    roles.forEach(role => {
      const probStr = (role.count > 0 && baseG > 0) 
        ? `1/${(baseG / role.count).toFixed(1)}` 
        : "1/----";

      const card = document.createElement("div");
      card.className = "role-card";
      card.innerHTML = `
        <div class="role-info">
          <div class="role-name" style="color: ${role.color}">${role.name}</div>
          <div class="role-stat">${role.count} 回 (${probStr})</div>
        </div>
        <button class="count-btn" 
                style="background-color: ${isMinusMode ? 'var(--accent-red)' : role.color}" 
                onclick="countRole('${role.id}')">
          ${isMinusMode ? '－' : '＋'}
        </button>
      `;
      listContainer.appendChild(card);
    });
  }

  // カウント操作
  function countRole(roleId) {
    const role = roles.find(r => r.id === roleId);
    if (role) {
      if (isMinusMode) {
        if (role.count > 0) role.count--;
      } else {
        role.count++;
      }
      render();
    }
  }

  // ゲーム数加減算
  function addGames(amount) {
    const delta = isMinusMode ? -amount : amount;
    if (myGames + delta >= 0) {
      myGames += delta;
      render();
    }
  }

  // 減算モード切替
  function toggleMinusMode() {
    isMinusMode = !isMinusMode;
    const btn = document.getElementById("modeBtn");
    if (isMinusMode) {
      btn.innerText = "－ 減算モード (ON)";
      btn.classList.add("minus-mode");
    } else {
      btn.innerText = "＋ 加算モード";
      btn.classList.remove("minus-mode");
    }
    render();
  }

  // 計算基準切替
  function toggleBase() {
    useMyGamesForProb = !useMyGamesForProb;
    const btn = document.getElementById("baseBtn");
    btn.innerText = useMyGamesForProb ? "基準: 個人G" : "基準: 総G";
    render();
  }

  // 打ち始めGセット
  function setStartGames() {
    const val = prompt("打ち始めゲーム数を入力:", startGames);
    if (val !== null && !isNaN(val)) {
      startGames = parseInt(val) || 0;
      render();
    }
  }

  // 総Gセット
  function setTotalGames() {
    const currentTotal = startGames + myGames;
    const val = prompt("現在の総ゲーム数を入力:", currentTotal);
    if (val !== null && !isNaN(val)) {
      const total = parseInt(val) || 0;
      if (total >= startGames) {
        myGames = total - startGames;
      } else {
        startGames = 0;
        myGames = total;
      }
      render();
    }
  }

  // リセット
  function resetAll() {
    if (confirm("全データをリセットしますか？")) {
      startGames = 0;
      myGames = 0;
      roles.forEach(r => r.count = 0);
      render();
    }
  }

  // 初回表示
  render();
</script>
</body>
</html>
