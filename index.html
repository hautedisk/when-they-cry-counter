<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SLOT COUNTER MOBILE</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg-main: #121212;
      --bg-panel: #1e1e1e;
      --fg-text: #ffffff;
      --fg-sub: #888888;
      --accent-blue: #007bff;
      --accent-green: #28a745;
      --accent-red: #dc3545;
      --accent-yellow: #ffc107;
      --accent-purple: #6f42c1;
      --accent-gray: #333333;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--fg-text);
      height: 100vh;
      height: 100dvh; /* スマホのアドレスバー考慮 */
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding: 6px;
      gap: 6px;
    }

    /* 上部ヘッダー（G数＆モード切り替え） */
    .top-section {
      background-color: var(--bg-panel);
      border-radius: 8px;
      padding: 6px 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex-shrink: 0;
    }

    .row-1 {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .mode-btn {
      padding: 4px 10px;
      background-color: #2a2a2a;
      color: var(--accent-green);
      border: 1px solid var(--accent-green);
      border-radius: 4px;
      font-weight: bold;
      font-size: 11px;
      cursor: pointer;
    }

    .mode-btn.minus-active {
      background-color: var(--accent-red);
      color: #fff;
      border-color: var(--accent-red);
    }

    .sub-btn {
      background-color: #2a2a2a;
      color: var(--fg-sub);
      border: none;
      padding: 3px 6px;
      border-radius: 4px;
      font-size: 10px;
      cursor: pointer;
    }
    .sub-btn.yellow { color: var(--accent-yellow); font-weight: bold; }

    .g-display {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
    }

    .my-g {
      font-size: 26px;
      font-weight: 900;
      color: var(--accent-green);
      line-height: 1;
    }

    .sub-g-info {
      font-size: 11px;
      color: var(--fg-sub);
      text-align: right;
    }

    /* G数クイック加算ボタン */
    .btn-grid {
      display: flex;
      gap: 4px;
    }

    .add-g-btn {
      flex: 1;
      padding: 6px 0;
      border: none;
      border-radius: 4px;
      font-weight: bold;
      font-size: 11px;
      color: #fff;
      cursor: pointer;
    }

    /* 中央メインエリア：子役リスト（全要素を画面内に等分） */
    .counter-grid {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
      overflow: hidden; /* スクリーン内に無理やり収める */
    }

    .role-row {
      flex: 1; /* 行の高さを均等分配 */
      background-color: var(--bg-panel);
      border-radius: 6px;
      padding: 0 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      min-height: 0; /* フレックス縮小許可 */
    }

    .role-info {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow: hidden;
    }

    .role-name {
      font-size: 13px;
      font-weight: bold;
      white-space: nowrap;
    }

    .role-prob {
      font-size: 12px;
      color: var(--fg-sub);
      font-family: monospace;
    }

    .role-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .role-count {
      font-size: 16px;
      font-weight: bold;
      font-family: monospace;
      min-width: 32px;
      text-align: right;
    }

    .count-btn {
      width: 46px;
      height: 80%;
      border: none;
      border-radius: 4px;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 下部サブナビ＆操作バー */
    .bottom-bar {
      display: flex;
      justify-content: space-between;
      gap: 4px;
      flex-shrink: 0;
    }

    .nav-btn {
      flex: 1;
      padding: 8px 0;
      background-color: var(--bg-panel);
      border: 1px solid #333;
      border-radius: 4px;
      color: var(--fg-sub);
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
    }
    .nav-btn.active {
      color: #fff;
      background-color: var(--accent-blue);
      border-color: var(--accent-blue);
    }

    /* モーダル（グラフ・設定用） */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background-color: rgba(0,0,0,0.85);
      z-index: 100;
      flex-direction: column;
      padding: 12px;
    }
    .modal.active { display: flex; }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .modal-close {
      background: var(--accent-red);
      color: #fff;
      border: none;
      padding: 4px 12px;
      border-radius: 4px;
      font-weight: bold;
    }
    .modal-body {
      flex: 1;
      overflow-y: auto;
      background: var(--bg-panel);
      border-radius: 8px;
      padding: 12px;
    }

    .setting-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid #333;
    }
  </style>
</head>
<body>

  <!-- 上部：G数＆モード管理 -->
  <div class="top-section">
    <div class="row-1">
      <button id="btnMinusMode" class="mode-btn" onclick="toggleMinusMode()">＋ 加算</button>
      <div>
        <button id="btnToggleBase" class="sub-btn yellow" onclick="toggleCalcBase()">個人G</button>
        <button class="sub-btn" onclick="setStartGame()">始: <span id="lblStartVal">0</span></button>
        <button class="sub-btn" onclick="setTotalGame()">総: <span id="lblTotalVal">0</span></button>
      </div>
    </div>

    <div class="g-display">
      <div id="lblMyGame" class="my-g">0 <span style="font-size:14px; color:#fff">G</span></div>
      <div class="sub-g-info" id="lblSubGInfo">総 0G / 始 0G</div>
    </div>

    <div class="btn-grid">
      <button class="add-g-btn" style="background-color: var(--accent-green)" onclick="addGames(1)">+1</button>
      <button class="add-g-btn" style="background-color: var(--accent-blue)" onclick="addGames(10)">+10</button>
      <button class="add-g-btn" style="background-color: var(--accent-yellow); color:#000" onclick="addGames(50)">+50</button>
      <button class="add-g-btn" style="background-color: var(--accent-purple)" onclick="addGames(100)">+100</button>
    </div>
  </div>

  <!-- 中央：子役カウンターリスト（画面サイズに合わせて自動フィット） -->
  <div id="counterGrid" class="counter-grid"></div>

  <!-- 下部：ナビゲーションバー -->
  <div class="bottom-bar">
    <button class="nav-btn" onclick="openModal('modalHistory')">📈 確率推移グラフ</button>
    <button class="nav-btn" onclick="openModal('modalSetting')">⚙ 子役選択</button>
    <button class="nav-btn" style="color:var(--accent-red)" onclick="resetAll()">全リセット</button>
  </div>

  <!-- モーダル：グラフ -->
  <div id="modalHistory" class="modal">
    <div class="modal-header">
      <h3>確率推移グラフ</h3>
      <button class="modal-close" onclick="closeModal('modalHistory')">閉じる</button>
    </div>
    <div class="modal-body">
      <canvas id="chartCanvas"></canvas>
    </div>
  </div>

  <!-- モーダル：設定 -->
  <div id="modalSetting" class="modal">
    <div class="modal-header">
      <h3>表示する子役を選択</h3>
      <button class="modal-close" onclick="closeModal('modalSetting')">閉じる</button>
    </div>
    <div class="modal-body" id="settingList"></div>
  </div>

  <script>
    // --- データ定義 ---
    const rolesConfig = [
      { name: "ベル", active: true, color: "#007bff" },
      { name: "弱チェリー", active: true, color: "#dc3545" },
      { name: "強チェリー", active: true, color: "#ff3344" },
      { name: "弱スイカ", active: true, color: "#28a745" },
      { name: "強スイカ", active: true, color: "#20c997" },
      { name: "チャンス目A", active: true, color: "#ffc107" },
      { name: "チャンス目B", active: true, color: "#ff9900" },
      { name: "確定役", active: false, color: "#9b59b6" }
    ];

    let startGames = 0;
    let myGames = 0;
    let useMyGamesForProb = true;
    let isMinusMode = false;
    let counts = {};
    let historyData = [];
    let chartInstance = null;

    rolesConfig.forEach(r => counts[r.name] = 0);
    recordHistory();

    function getTotalGames() { return startGames + myGames; }
    function getCalcBaseGames() { return useMyGamesForProb ? myGames : getTotalGames(); }

    function recordHistory() {
      const calcG = getCalcBaseGames();
      const last = historyData[historyData.length - 1];
      if (last && last.myGames === myGames) {
        last.counts = { ...counts };
        last.calcGames = calcG;
      } else {
        historyData.push({ myGames: myGames, calcGames: calcG, counts: { ...counts } });
      }
    }

    // レンダリング
    function renderCounter() {
      const grid = document.getElementById("counterGrid");
      grid.innerHTML = "";

      const baseG = getCalcBaseGames();

      rolesConfig.forEach(role => {
        if (!role.active) return;

        const count = counts[role.name] || 0;
        const probStr = (count > 0 && baseG > 0) ? `1/${(baseG / count).toFixed(1)}` : "1/--";
        const btnText = isMinusMode ? "－" : "＋";
        const btnBg = isMinusMode ? "var(--accent-red)" : role.color;

        const row = document.createElement("div");
        row.className = "role-row";
        row.innerHTML = `
          <div class="role-info">
            <span class="role-name" style="color:${role.color}">${role.name}</span>
            <span class="role-prob">${probStr}</span>
          </div>
          <div class="role-right">
            <span class="role-count">${count}</span>
            <button class="count-btn" style="background-color:${btnBg}" onclick="countRole('${role.name}')">${btnText}</button>
          </div>
        `;
        grid.appendChild(row);
      });

      document.getElementById("lblMyGame").innerHTML = `${myGames} <span style="font-size:14px; color:#fff">G</span>`;
      document.getElementById("lblStartVal").innerText = startGames;
      document.getElementById("lblTotalVal").innerText = getTotalGames();
      document.getElementById("lblSubGInfo").innerText = `総 ${getTotalGames()}G / 始 ${startGames}G`;
    }

    function renderSettings() {
      const list = document.getElementById("settingList");
      list.innerHTML = "";
      rolesConfig.forEach(role => {
        const item = document.createElement("div");
        item.className = "setting-item";
        item.innerHTML = `
          <input type="checkbox" id="cb-${role.name}" ${role.active ? "checked" : ""} style="width:20px;height:20px" onchange="toggleRole('${role.name}')">
          <label for="cb-${role.name}" style="font-size:16px; color:#fff">${role.name}</label>
        `;
        list.appendChild(item);
      });
    }

    // アクション
    function countRole(name) {
      const delta = isMinusMode ? -1 : 1;
      if (counts[name] + delta >= 0) {
        counts[name] += delta;
        recordHistory();
        renderCounter();
      }
    }

    function addGames(amount) {
      const delta = isMinusMode ? -amount : amount;
      if (myGames + delta >= 0) {
        myGames += delta;
        recordHistory();
        renderCounter();
      }
    }

    function toggleMinusMode() {
      isMinusMode = !isMinusMode;
      const btn = document.getElementById("btnMinusMode");
      btn.innerText = isMinusMode ? "－ 減算" : "＋ 加算";
      btn.classList.toggle("minus-active", isMinusMode);
      renderCounter();
    }

    function toggleCalcBase() {
      useMyGamesForProb = !useMyGamesForProb;
      const btn = document.getElementById("btnToggleBase");
      btn.innerText = useMyGamesForProb ? "個人G" : "総G";
      recordHistory();
      renderCounter();
    }

    function setStartGame() {
      const val = prompt("打ち始めゲーム数:", startGames);
      if (val !== null && !isNaN(val) && val >= 0) {
        startGames = parseInt(val, 10);
        recordHistory();
        renderCounter();
      }
    }

    function setTotalGame() {
      const val = prompt("現在の総ゲーム数:", getTotalGames());
      if (val !== null && !isNaN(val)) {
        const total = parseInt(val, 10);
        myGames = Math.max(0, total - startGames);
        recordHistory();
        renderCounter();
      }
    }

    function toggleRole(name) {
      const role = rolesConfig.find(r => r.name === name);
      if (role) role.active = !role.active;
      renderCounter();
    }

    function resetAll() {
      if (confirm("データを全リセットしますか？")) {
        startGames = 0; myGames = 0; isMinusMode = false;
        rolesConfig.forEach(r => counts[r.name] = 0);
        historyData = [];
        recordHistory();
        renderCounter();
      }
    }

    // モーダル処理
    function openModal(id) {
      document.getElementById(id).classList.add("active");
      if (id === "modalHistory") updateGraph();
    }

    function closeModal(id) {
      document.getElementById(id).classList.remove("active");
    }

    // グラフ描画
    function updateGraph() {
      const ctx = document.getElementById("chartCanvas").getContext("2d");
      const labels = historyData.map(h => h.calcGames);
      const datasets = rolesConfig.filter(r => r.active).map(role => ({
        label: role.name,
        data: historyData.map(h => {
          const c = h.counts[role.name] || 0;
          return c > 0 ? (h.calcGames / c).toFixed(1) : null;
        }),
        borderColor: role.color,
        backgroundColor: role.color,
        spanGaps: true,
        tension: 0.1
      }));

      if (chartInstance) chartInstance.destroy();
      chartInstance = new Chart(ctx, {
        type: 'line',
        data: { labels, datasets },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            x: { title: { display: true, text: 'G数', color: '#888' }, grid: { color: '#333' } },
            y: { title: { display: true, text: '確率分母 (1/X)', color: '#888' }, grid: { color: '#333' } }
          },
          plugins: { legend: { labels: { color: '#fff' } } }
        }
      });
    }

    // 初期起動
    renderCounter();
    renderSettings();
  </script>
</body>
</html>
