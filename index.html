<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ひぐらし祭2 設定判別カウンタ</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  :root {
    --bg-color: #1a1a1a;
    --card-bg: #2a2a2a;
    --accent-color: #e65100;
    --text-color: #e0e0e0;
    --border-color: #444;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background-color: var(--bg-color);
    color: var(--text-color);
    margin: 0;
    padding: 10px;
    box-sizing: border-box;
  }
  h1, h2 { text-align: center; font-size: 1.2rem; margin: 10px 0; }
  
  /* タブナビゲーション */
  .tabs {
    display: flex;
    justify-content: space-around;
    background: #000;
    border-radius: 8px;
    margin-bottom: 15px;
    padding: 4px;
  }
  .tab-btn {
    flex: 1;
    padding: 10px;
    border: none;
    background: transparent;
    color: #888;
    font-weight: bold;
    font-size: 0.95rem;
    cursor: pointer;
    border-radius: 6px;
  }
  .tab-btn.active {
    background: var(--accent-color);
    color: #fff;
  }
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  /* ゲーム数入力エリア */
  .game-input-group {
    background: var(--card-bg);
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 15px;
    text-align: center;
  }
  .game-input-group label { font-size: 0.9rem; display: block; margin-bottom: 5px; }
  .game-num-input {
    width: 100px;
    font-size: 1.3rem;
    text-align: center;
    background: #111;
    color: #fff;
    border: 1px solid var(--border-color);
    border-radius: 4px;
    padding: 4px;
  }
  .btn-step-group {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-top: 8px;
  }
  .btn-step {
    background: #333;
    color: #fff;
    border: 1px solid var(--border-color);
    padding: 6px 12px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 0.85rem;
  }
  .btn-step:active { background: #555; }

  /* カウンタグリッド */
  .counter-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 10px;
  }
  .art-grid {
    /* ART中は横にはみ出さず一画面に収まるようコンパクトに配置 */
    grid-template-columns: repeat(2, 1fr);
  }
  .counter-card {
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 8px;
    padding: 8px;
    text-align: center;
  }
  .counter-title { font-weight: bold; font-size: 0.9rem; margin-bottom: 4px; }
  .counter-value { font-size: 1.5rem; color: #ffb74d; margin: 4px 0; }
  .counter-rate { font-size: 0.75rem; color: #aaa; min-height: 1.2em; }
  .btn-count {
    width: 100%;
    padding: 8px;
    font-size: 1rem;
    font-weight: bold;
    background: #1e88e5;
    color: #fff;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    margin-top: 4px;
  }
  .btn-count:active { background: #1565c0; }
  .btn-sub {
    width: 100%;
    padding: 4px;
    font-size: 0.75rem;
    background: #424242;
    color: #bbb;
    border: none;
    border-radius: 4px;
    margin-top: 4px;
    cursor: pointer;
  }

  /* セクション見出し */
  .section-title {
    font-size: 0.95rem;
    color: #ff9800;
    border-bottom: 1px solid #444;
    padding-bottom: 4px;
    margin: 15px 0 10px 0;
  }

  /* グラフ表示エリア */
  .chart-container {
    background: var(--card-bg);
    border-radius: 8px;
    padding: 10px;
    margin-top: 15px;
  }
</style>
</head>
<body>

<h1>ひぐらし祭2 設定判別</h1>

<!-- タブ切り替え -->
<div class="tabs">
  <button class="tab-btn active" onclick="switchTab('normal')">通常時</button>
  <button class="tab-btn" onclick="switchTab('bonus')">ボーナス</button>
  <button class="tab-btn" onclick="switchTab('art')">ART中</button>
</div>

<!-- ================= 通常時タブ ================= -->
<div id="tab-normal" class="tab-content active">
  <div class="game-input-group">
    <label>通常ゲーム数</label>
    <input type="number" id="g-normal" class="game-num-input" value="0" onchange="updateCalculations()">
    <div class="btn-step-group">
      <button class="btn-step" onclick="addGames('g-normal', 10)">+10</button>
      <button class="btn-step" onclick="addGames('g-normal', 50)">+50</button>
      <button class="btn-step" onclick="addGames('g-normal', 100)">+100</button>
      <button class="btn-step" onclick="addGames('g-normal', -100)">-100</button>
    </div>
  </div>

  <div class="section-title">小役・レア役枠</div>
  <div class="counter-grid">
    <div class="counter-card">
      <div class="counter-title">スイカ</div>
      <div class="counter-value" id="val-watermelon">0</div>
      <div class="counter-rate" id="rate-watermelon">1/-</div>
      <button class="btn-count" onclick="countUp('watermelon', 1)">+1</button>
      <button class="btn-sub" onclick="countUp('watermelon', -1)">-1</button>
    </div>
    <div class="counter-card">
      <div class="counter-title">確定役</div>
      <div class="counter-value" id="val-certain">0</div>
      <div class="counter-rate" id="rate-certain">1/-</div>
      <button class="btn-count" onclick="countUp('certain', 1)">+1</button>
      <button class="btn-sub" onclick="countUp('certain', -1)">-1</button>
    </div>
  </div>

  <div class="section-title">独立枠（レアベル / ひぐらしハズレ）</div>
  <div class="counter-grid">
    <div class="counter-card">
      <div class="counter-title">レアベル</div>
      <div class="counter-value" id="val-rarebell">0</div>
      <div class="counter-rate" id="rate-rarebell">1/-</div>
      <button class="btn-count" onclick="countUp('rarebell', 1)">+1</button>
      <button class="btn-sub" onclick="countUp('rarebell', -1)">-1</button>
    </div>
    <div class="counter-card">
      <div class="counter-title">ひぐらしハズレ</div>
      <div class="counter-value" id="val-higurashi-miss">0</div>
      <div class="counter-rate" id="rate-higurashi-miss">1/-</div>
      <button class="btn-count" onclick="countUp('higurashi-miss', 1)">+1</button>
      <button class="btn-sub" onclick="countUp('higurashi-miss', -1)">-1</button>
    </div>
  </div>
</div>

<!-- ================= ボーナスタブ ================= -->
<div id="tab-bonus" class="tab-content">
  <div class="section-title">ビタ押し・BIG初回単独キャラ枠</div>
  <div class="counter-grid">
    <div class="counter-card">
      <div class="counter-title">圭一</div>
      <div class="counter-value" id="val-ch-keiichi">0</div>
      <button class="btn-count" onclick="countUp('ch-keiichi', 1)">+1</button>
      <button class="btn-sub" onclick="countUp('ch-keiichi', -1)">-1</button>
    </div>
    <div class="counter-card">
      <div class="counter-title">魅音</div>
      <div class="counter-value" id="val-ch-mion">0</div>
      <button class="btn-count" onclick="countUp('ch-mion', 1)">+1</button>
      <button class="btn-sub" onclick="countUp('ch-mion', -1)">-1</button>
    </div>
    <div class="counter-card">
      <div class="counter-title">沙都子</div>
      <div class="counter-value" id="val-ch-satoko">0</div>
      <button class="btn-count" onclick="countUp('ch-satoko', 1)">+1</button>
      <button class="btn-sub" onclick="countUp('ch-satoko', -1)">-1</button>
    </div>
    <div class="counter-card">
      <div class="counter-title">詩音</div>
      <div class="counter-value" id="val-ch-shion">0</div>
      <button class="btn-count" onclick="countUp('ch-shion', 1)">+1</button>
      <button class="btn-sub" onclick="countUp('ch-shion', -1)">-1</button>
    </div>
    <div class="counter-card">
      <div class="counter-title">レナ</div>
      <div class="counter-value" id="val-ch-rena">0</div>
      <button class="btn-count" onclick="countUp('ch-rena', 1)">+1</button>
      <button class="btn-sub" onclick="countUp('ch-rena', -1)">-1</button>
    </div>
    <div class="counter-card">
      <div class="counter-title">梨花</div>
      <div class="counter-value" id="val-ch-rika">0</div>
      <button class="btn-count" onclick="countUp('ch-rika', 1)">+1</button>
      <button class="btn-sub" onclick="countUp('ch-rika', -1)">-1</button>
    </div>
  </div>
</div>

<!-- ================= ART中タブ ================= -->
<div id="tab-art" class="tab-content">
  <div class="game-input-group">
    <label>ARTゲーム数</label>
    <input type="number" id="g-art" class="game-num-input" value="0" onchange="updateCalculations()">
    <div class="btn-step-group">
      <button class="btn-step" onclick="addGames('g-art', 10)">+10</button>
      <button class="btn-step" onclick="addGames('g-art', 50)">+50</button>
      <button class="btn-step" onclick="addGames('g-art', 100)">+100</button>
      <button class="btn-step" onclick="addGames('g-art', -100)">-100</button>
    </div>
  </div>

  <!-- 1画面に収まりやすい2列構成 -->
  <div class="counter-grid art-grid">
    <div class="counter-card">
      <div class="counter-title">ARTベル</div>
      <div class="counter-value" id="val-art-bell">0</div>
      <div class="counter-rate" id="rate-art-bell">1/-</div>
      <button class="btn-count" onclick="countUp('art-bell', 1)">+1</button>
      <button class="btn-sub" onclick="countUp('art-bell', -1)">-1</button>
    </div>
    <div class="counter-card">
      <div class="counter-title">ARTハズレ</div>
      <div class="counter-value" id="val-art-miss">0</div>
      <div class="counter-rate" id="rate-art-miss">1/-</div>
      <button class="btn-count" onclick="countUp('art-miss', 1)">+1</button>
      <button class="btn-sub" onclick="countUp('art-miss', -1)">-1</button>
    </div>
  </div>

  <!-- ART中 確率推移スランプグラフ -->
  <div class="chart-container">
    <h2>ART中 確率推移グラフ</h2>
    <canvas id="artChart"></canvas>
  </div>
</div>

<script>
  // カウンター状態管理
  const state = {
    watermelon: 0,
    certain: 0,
    rarebell: 0,
    'higurashi-miss': 0,
    'art-bell': 0,
    'art-miss': 0,
    'ch-keiichi': 0,
    'ch-mion': 0,
    'ch-satoko': 0,
    'ch-shion': 0,
    'ch-rena': 0,
    'ch-rika': 0
  };

  // ART確率履歴（グラフ描画用）
  const artHistory = [];

  // タブ切り替え
  function switchTab(tabName) {
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
    
    event.currentTarget.classList.add('active');
    document.getElementById(`tab-${tabName}`).classList.add('active');
  }

  // ゲーム数直接変更 & ボタン加算
  function addGames(id, val) {
    const input = document.getElementById(id);
    let cur = parseInt(input.value) || 0;
    cur = Math.max(0, cur + val);
    input.value = cur;
    updateCalculations();
  }

  // カウントアップ/ダウン
  function countUp(key, delta) {
    state[key] = Math.max(0, state[key] + delta);
    document.getElementById(`val-${key}`).textContent = state[key];

    // ART関連の変更時に履歴を記録
    if (key === 'art-bell' || key === 'art-miss') {
      recordArtHistory();
    }

    updateCalculations();
  }

  // 確率計算と表示更新
  function updateCalculations() {
    const gNormal = parseInt(document.getElementById('g-normal').value) || 0;
    const gArt = parseInt(document.getElementById('g-art').value) || 0;

    // 通常時小役確率
    calcRate('watermelon', gNormal);
    calcRate('certain', gNormal);
    calcRate('rarebell', gNormal);
    calcRate('higurashi-miss', gNormal);

    // ART中確率
    calcRate('art-bell', gArt);
    calcRate('art-miss', gArt);

    updateChart();
  }

  function calcRate(key, games) {
    const rateEl = document.getElementById(`rate-${key}`);
    if (!rateEl) return;
    const count = state[key];
    if (games > 0 && count > 0) {
      const rate = (games / count).toFixed(1);
      rateEl.textContent = `1/${rate}`;
    } else {
      rateEl.textContent = '1/-';
    }
  }

  // ART履歴の記録
  function recordArtHistory() {
    const gArt = parseInt(document.getElementById('g-art').value) || 0;
    if (gArt <= 0) return;

    artHistory.push({
      g: gArt,
      bellRate: state['art-bell'] > 0 ? (gArt / state['art-bell']) : null,
      missRate: state['art-miss'] > 0 ? (gArt / state['art-miss']) : null
    });
  }

  // Chart.js グラフ初期化＆更新
  let artChart;
  function initChart() {
    const ctx = document.getElementById('artChart').getContext('2d');
    artChart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: [],
        datasets: [
          {
            label: 'ARTベル分母 (1/X)',
            data: [],
            borderColor: '#ffb74d',
            backgroundColor: 'transparent',
            tension: 0.1
          },
          {
            label: 'ARTハズレ分母 (1/X)',
            data: [],
            borderColor: '#ff5252',
            backgroundColor: 'transparent',
            tension: 0.1
          }
        ]
      },
      options: {
        responsive: true,
        scales: {
          x: {
            title: { display: true, text: 'ART G数', color: '#888' },
            ticks: { color: '#888' }
          },
          y: {
            title: { display: true, text: '確率分母', color: '#888' },
            ticks: { color: '#888' },
            reverse: true // 確率が軽い(良い)ほど上に行くスランプ表示風設定
          }
        },
        plugins: {
          legend: { labels: { color: '#ccc' } }
        }
      }
    });
  }

  function updateChart() {
    if (!artChart) return;
    
    // データポイントが多すぎる場合は 間引き/最新化
    const labels = artHistory.map(h => `${h.g}G`);
    const bellData = artHistory.map(h => h.bellRate);
    const missData = artHistory.map(h => h.missRate);

    artChart.data.labels = labels;
    artChart.data.datasets[0].data = bellData;
    artChart.data.datasets[1].data = missData;
    artChart.update();
  }

  window.onload = function() {
    initChart();
  };
</script>
</body>
</html>
