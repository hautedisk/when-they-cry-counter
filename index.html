<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>SLOT COUNTER MOBILE</title>
  <!-- グラフ描画用 Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg-main: #121212;
      --bg-panel: #1e1e1e;
      --fg-text: #ffffff;
      --fg-sub: #888888;
      --accent-blue: #007bff;
      --accent-green: #28a745;
      --accent-red: #dc3545;
      --accent-yellow: #ffc107;
      --accent-purple: #6f42c1;
      --accent-gray: #444444;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-main);
      color: var(--fg-text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* タブヘッダー */
    .tab-header {
      display: flex;
      background-color: var(--bg-panel);
      border-bottom: 1px solid #333;
    }

    .tab-btn {
      flex: 1;
      padding: 12px 0;
      background: none;
      border: none;
      color: var(--fg-sub);
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
    }

    .tab-btn.active {
      color: var(--fg-text);
      background-color: var(--accent-blue);
    }

    /* タブコンテンツエリア */
    .tab-content {
      flex: 1;
      display: none;
      flex-direction: column;
      overflow-y: auto;
      padding: 10px;
    }

    .tab-content.active {
      display: flex;
    }

    /* 減算モード切り替えバー */
    .mode-bar {
      margin-bottom: 8px;
    }

    .mode-btn {
      width: 100%;
      padding: 10px;
      background-color: var(--bg-panel);
      color: var(--accent-green);
      border: none;
      border-radius: 6px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
    }

    .mode-btn.minus-active {
      background-color: var(--accent-red);
      color: #fff;
    }

    /* ゲーム数パネル */
    .game-panel {
      background-color: var(--bg-panel);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 8px;
    }

    .top-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .sub-btn {
      background-color: var(--bg-main);
      color: var(--fg-text);
      border: none;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
    }

    .sub-btn.yellow { color: var(--accent-yellow); }

    .disp-frame {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .lbl-my-game {
      font-size: 32px;
      font-weight: bold;
      color: var(--accent-green);
    }

    .sub-g-box {
      text-align: right;
    }

    .lbl-start-game { font-size: 11px; color: var(--fg-sub); }
    .lbl-total-game { font-size: 14px; font-weight: bold; }

    /* ゲーム数加算ボタン */
    .btn-grid {
      display: flex;
      gap: 4px;
    }

    .add-g-btn {
      flex: 1;
      padding: 10px 0;
      border: none;
      border-radius: 4px;
      font-weight: bold;
      color: #fff;
      cursor: pointer;
    }

    /* カウンターリスト */
    .counter-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .role-row {
      background-color: var(--bg-panel);
      border-radius: 6px;
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .role-info {
      display: flex;
      flex-direction: column;
    }

    .role-name {
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 2px;
    }

    .role-count-info {
      font-size: 12px;
      color: var(--fg-text);
      font-family: monospace;
    }

    .count-btn {
      width: 60px;
      height: 44px;
      border: none;
      border-radius: 6px;
      color: #fff;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
    }

    /* フッター */
    .footer {
      text-align: center;
      padding: 6px;
    }

    .reset-btn {
      background-color: var(--accent-gray);
      color: var(--fg-sub);
      border: none;
      padding: 6px 16px;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
    }

    /* 設定タブ */
    .setting-panel {
      background-color: var(--bg-panel);
      padding: 16px;
      border-radius: 8px;
    }

    .setting-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 0;
      border-bottom: 1px solid #333;
    }

    .setting-item input {
      width: 18px;
      height: 18px;
    }

    /* グラフ用キャンバス */
    #chartCanvas {
      width: 100% !important;
      height: 100% !important;
    }
  </style>
</head>
<body>

  <!-- タブナビゲーション -->
  <div class="tab-header">
    <button class="tab-btn active" onclick="switchTab('counter')">カウンター</button>
    <button class="tab-btn" onclick="switchTab('history')">確率推移</button>
    <button class="tab-btn" onclick="switchTab('setting')">設定</button>
  </div>

  <!-- 1. カウンタータブ -->
  <div id="tab-counter" class="tab-content active">
    <div class="mode-bar">
      <button id="btnMinusMode" class="mode-btn" onclick="toggleMinusMode()">＋ 加算モード</button>
    </div>

    <div class="game-panel">
      <div class="top-row">
        <button id="btnToggleBase" class="sub-btn yellow" onclick="toggleCalcBase()">基準: 個人G</button>
        <div>
          <button class="sub-btn" onclick="setStartGame()">打ち始めG</button>
          <button class="sub-btn" onclick="setTotalGame()">総G入力</button>
        </div>
      </div>
      <div class="disp-frame">
        <div id="lblMyGame" class="lbl-my-game">0 G</div>
        <div class="sub-g-box">
          <div id="lblStartGame" class="lbl-start-game">START : 0 G</div>
          <div id="lblTotalGame" class="lbl-total-game">TOTAL : 0 G</div>
        </div>
      </div>
      <div class="btn-grid">
        <button class="add-g-btn" style="background-color: var(--accent-green)" onclick="addGames(1)">+1G</button>
        <button class="add-g-btn" style="background-color: var(--accent-blue)" onclick="addGames(10)">+10G</button>
        <button class="add-g-btn" style="background-color: var(--accent-yellow); color:#000" onclick="addGames(50)">+50G</button>
        <button class="add-g-btn" style="background-color: var(--accent-purple)" onclick="addGames(100)">+100G</button>
      </div>
    </div>

    <div id="counterList" class="counter-list"></div>

    <div class="footer">
      <button class="reset-btn" onclick="resetAll()">リセット</button>
    </div>
  </div>

  <!-- 2. 確率推移タブ -->
  <div id="tab-history" class="tab-content">
    <canvas id="chartCanvas"></canvas>
  </div>

  <!-- 3. 設定タブ -->
  <div id="tab-setting" class="tab-content">
    <div class="setting-panel">
      <h3 style="margin-bottom:12px; font-size:14px; color:var(--fg-sub)">カウントする子役を選択</h3>
      <div id="settingList"></div>
    </div>
  </div>

  <script>
    // --- データ定義 ---
    const rolesConfig = [
      { name: "ベル", active: true, color: "#007bff" },
      { name: "弱チェリー", active: true, color: "#dc3545" },
      { name: "強チェリー", active: true, color: "#ff3344" },
      { name: "弱スイカ", active: true, color: "#28a745" },
      { name: "強スイカ", active: true, color: "#20c997" },
      { name: "チャンス目A", active: true, color: "#ffc107" },
      { name: "チャンス目B", active: true, color: "#ff9900" },
      { name: "チャンス目C", active: true, color: "#e67e22" },
      { name: "確定役", active: true, color: "#9b59b6" },
      { name: "中段チェリー", active: true, color: "#8e44ad" }
    ];

    let startGames = 0;
    let myGames = 0;
    let useMyGamesForProb = true;
    let isMinusMode = false;
    let counts = {};
    let historyData = [];
    let chartInstance = null;

    // 初期化
    rolesConfig.forEach(r => counts[r.name] = 0);
    recordHistory();

    function getTotalGames() { return startGames + myGames; }
    function getCalcBaseGames() { return useMyGamesForProb ? myGames : getTotalGames(); }

    function recordHistory() {
      const calcG = getCalcBaseGames();
      const last = historyData[historyData.length - 1];
      if (last && last.myGames === myGames) {
        last.counts = { ...counts };
        last.calcGames = calcG;
      } else {
        historyData.push({
          myGames: myGames,
          calcGames: calcG,
          counts: { ...counts }
        });
      }
    }

    // --- UI レンダリング ---
    function renderCounter() {
      const list = document.getElementById("counterList");
      list.innerHTML = "";

      const baseG = getCalcBaseGames();

      rolesConfig.forEach(role => {
        if (!role.active) return;

        const count = counts[role.name] || 0;
        const probStr = (count > 0 && baseG > 0) ? `(1/${(baseG / count).toFixed(1)})` : "(1/----)";
        const btnText = isMinusMode ? "－" : "＋";
        const btnBg = isMinusMode ? "var(--accent-red)" : role.color;

        const row = document.createElement("div");
        row.className = "role-row";
        row.innerHTML = `
          <div class="role-info">
            <span class="role-name" style="color:${role.color}">${role.name}</span>
            <span class="role-count-info">${count} 回 ${probStr}</span>
          </div>
          <button class="count-btn" style="background-color:${btnBg}" onclick="countRole('${role.name}')">${btnText}</button>
        `;
        list.appendChild(row);
      });

      document.getElementById("lblMyGame").innerText = `${myGames} G`;
      document.getElementById("lblStartGame").innerText = `START : ${startGames} G`;
      document.getElementById("lblTotalGame").innerText = `TOTAL : ${getTotalGames()} G`;
    }

    function renderSettings() {
      const list = document.getElementById("settingList");
      list.innerHTML = "";

      rolesConfig.forEach(role => {
        const item = document.createElement("div");
        item.className = "setting-item";
        item.innerHTML = `
          <input type="checkbox" id="cb-${role.name}" ${role.active ? "checked" : ""} onchange="toggleRole('${role.name}')">
          <label for="cb-${role.name}">${role.name}</label>
        `;
        list.appendChild(item);
      });
    }

    // --- ロジック ---
    function countRole(name) {
      const delta = isMinusMode ? -1 : 1;
      if (counts[name] + delta >= 0) {
        counts[name] += delta;
        recordHistory();
        renderCounter();
      }
    }

    function addGames(amount) {
      const delta = isMinusMode ? -amount : amount;
      if (myGames + delta >= 0) {
        myGames += delta;
        recordHistory();
        renderCounter();
      }
    }

    function toggleMinusMode() {
      isMinusMode = !isMinusMode;
      const btn = document.getElementById("btnMinusMode");
      if (isMinusMode) {
        btn.innerText = "－ 減算モード ON";
        btn.classList.add("minus-active");
      } else {
        btn.innerText = "＋ 加算モード";
        btn.classList.remove("minus-active");
      }
      renderCounter();
    }

    function toggleCalcBase() {
      useMyGamesForProb = !useMyGamesForProb;
      const btn = document.getElementById("btnToggleBase");
      btn.innerText = useMyGamesForProb ? "基準: 個人G" : "基準: 総G";
      btn.className = useMyGamesForProb ? "sub-btn yellow" : "sub-btn";
      recordHistory();
      renderCounter();
    }

    function setStartGame() {
      const val = prompt("打ち始めゲーム数を入力:", startGames);
      if (val !== null && !isNaN(val) && val >= 0) {
        startGames = parseInt(val, 10);
        recordHistory();
        renderCounter();
      }
    }

    function setTotalGame() {
      const val = prompt("現在の総ゲーム数を入力:", getTotalGames());
      if (val !== null && !isNaN(val)) {
        const total = parseInt(val, 10);
        if (total >= startGames) {
          myGames = total - startGames;
        } else {
          startGames = 0;
          myGames = total;
        }
        recordHistory();
        renderCounter();
      }
    }

    function toggleRole(name) {
      const role = rolesConfig.find(r => r.name === name);
      if (role) role.active = !role.active;
      renderCounter();
    }

    function resetAll() {
      if (confirm("全データをリセットしますか？")) {
        startGames = 0;
        myGames = 0;
        isMinusMode = false;
        rolesConfig.forEach(r => counts[r.name] = 0);
        historyData = [];
        recordHistory();
        renderCounter();
      }
    }

    // --- タブ切り替え ---
    function switchTab(tabName) {
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      document.querySelectorAll(".tab-content").forEach(c => c.classList.remove("active"));

      event.target.classList.add("active");
      document.getElementById(`tab-${tabName}`).classList.add("active");

      if (tabName === "history") {
        updateGraph();
      }
    }

    // --- グラフ描画 ---
    function updateGraph() {
      const ctx = document.getElementById("chartCanvas").getContext("2d");
      const labels = historyData.map(h => h.calcGames);

      const datasets = rolesConfig.filter(r => r.active).map(role => {
        const data = historyData.map(h => {
          const g = h.calcGames;
          const c = h.counts[role.name] || 0;
          return c > 0 ? (g / c).toFixed(1) : null;
        });

        return {
          label: role.name,
          data: data,
          borderColor: role.color,
          backgroundColor: role.color,
          spanGaps: true,
          tension: 0.1
        };
      });

      if (chartInstance) chartInstance.destroy();

      chartInstance = new Chart(ctx, {
        type: 'line',
        data: { labels: labels, datasets: datasets },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            x: { title: { display: true, text: 'ゲーム数', color: '#888' }, grid: { color: '#333' } },
            y: { title: { display: true, text: '確率分母 (1/X)', color: '#888' }, grid: { color: '#333' } }
          },
          plugins: {
            legend: { labels: { color: '#fff' } }
          }
        }
      });
    }

    // 初期表示処理
    renderCounter();
    renderSettings();
  </script>
</body>
</html>
